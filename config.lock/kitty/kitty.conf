# =============================================================================
#  Kitty Terminal Emulator Configuration
# =============================================================================

# 1. External Imports
include ./sl_colors.conf
include ./sl_appearance.conf
include ./keymaps.conf

# 2. General & Shell
shell fish
confirm_os_window_close 1
allow_remote_control yes

# 3. Cursor & Animation Effects
cursor_shape beam
cursor_trail 4
cursor_trail_decay 0.1 0.6
cursor_trail_start_threshold 1

# 4. Window Geometry & Decoration
background_blur 1
remember_window_position yes
hide_window_decorations no
placement_strategy center
window_border_width 0
draw_minimal_borders no
window_margin_width 0
window_padding_width 0

# 5. Background & Transparency (Controlled dynamically by colors.conf)
# background_opacity configured in 2-xdg-config-var.nix
inactive_text_alpha 0.35

# 6. Tab Bar Layout
tab_bar_edge bottom
tab_bar_margin_width 0.0
tab_bar_margin_height 0.0 0.0

# 7. Scrollback & Vim Mode Navigation
scrollback_lines 10000
scrollback_pager nvim -u NONE -c "set nonumber nolist showtabline=0 foldcolumn=0 laststatus=0 noswapfile buftype=nofile readonly nomodifiable" -c "autocmd TermOpen * normal G" -c "nnoremap q :qa!<CR>" -c "nnoremap <ESC> :qa!<CR>" -
