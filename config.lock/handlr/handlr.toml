# =============================================================================
#  Handlr-regex Configuration (Auto-generated by sl-render from tokens)
#  Location: ~/.config/handlr/handlr.toml
# =============================================================================

enable_selector = true
selector = "fuzzel -d"

# Default terminal arguments
term_exec_args = "-e"

# ╭─────────────────────────────────────────────────────────╮
# │ Dynamic Application Handlers (tokens/apps.toml)         │
# ╰─────────────────────────────────────────────────────────╯


# Web Browsers & URL Schemes (helium)
[[handlers]]
exec = "helium %u"
terminal = false
regexes = [
  '^(https?|ftp|about|chrome)://.*',
  '^mailto:.*',
]



# Text, Code & Configuration Files (codium)
[[handlers]]
exec = "codium %u"
terminal = false
regexes = [
  '.*\.(txt|md|markdown|json|toml|yaml|yml|xml|ini|conf|cfg|nix|py|rs|go|c|cpp|h|hpp|js|ts|jsx|tsx|sh|fish|zsh)$',
]



# Documents & PDFs (readest)
[[handlers]]
exec = "readest %u"
terminal = false
regexes = [
  '.*\.(pdf|epub|oxps|djvu|cbr|cbz)$',
]



# Image Formats (imv)
[[handlers]]
exec = "imv %u"
terminal = false
regexes = [
  '.*\.(png|jpg|jpeg|gif|webp|svg|bmp|avif|jxl|ico|tiff)$',
]



# Video Files & Media Streams (mpv)
[[handlers]]
exec = "mpv %u"
terminal = false
regexes = [
  '.*\.(mp4|mkv|webm|avi|mov|flv|wmv|ts)$',
  '^(https?://)?(www\.)?(youtube\.com|youtu\.be|twitch\.tv)/.*',
]



# Audio Files (vlc)
[[handlers]]
exec = "vlc %u"
terminal = false
regexes = [
  '.*\.(mp3|flac|wav|ogg|opus|m4a|aac|mid|midi)$',
]



# Directories & Compressed Archives (nemo)
[[handlers]]
exec = "nemo %u"
terminal = false
regexes = [
  '.*\.(zip|tar|tar\.gz|tgz|tar\.bz2|tbz2|tar\.xz|txz|7z|rar|iso)$',
]

