# =============================================================================
#  System & Desktop Keybindings (keybinds.toml)
# =============================================================================

# System & Session Binds
[[system_binds]]
key = "Mod+Shift+E"
title = "Power & Session Menu: Fuzzel"
action = "spawn \"power-menu\""

[[system_binds]]
key = "Ctrl+Alt+Delete"
title = "Power & Session Menu: Fuzzel"
action = "spawn \"power-menu\""

[[system_binds]]
key = "Mod+Shift+P"
action = "power-off-monitors"

[[system_binds]]
key = "Mod+Slash"
action = "show-hotkey-overlay"

[[system_binds]]
key = "Mod+Escape"
allow_inhibiting_false = true
action = "toggle-keyboard-shortcuts-inhibit"

# Application Launchers
[[app_binds]]
key = "Super+Return"
title = "Terminal: Kitty"
action = "spawn \"kitty\""

[[app_binds]]
key = "Super+E"
title = "File Manager: Thunar"
action = "spawn \"thunar\""

[[app_binds]]
key = "Super+A"
title = "Application Launcher: Fuzzel"
action = "spawn \"fuzzel\""

[[app_binds]]
key = "Mod+B"
title = "Web Browser: Librewolf"
action = "spawn \"librewolf\""

[[app_binds]]
key = "Super+Alt+L"
title = "Lock Screen: Swaylock"
action = "spawn \"swaylock\""

[[app_binds]]
key = "Mod+N"
title = "Status Bar: Toggle Wayle"
repeat_false = true
action = "spawn-sh \"wayle panel toggle || wayle shell\""

[[app_binds]]
key = "Mod+C"
repeat_false = true
action = "spawn-sh \"cliphist list | fuzzel -d | cliphist decode | wl-copy\""

[[app_binds]]
key = "Mod+Shift+W"
title = "Wallpaper Setter: Waypaper"
action = "spawn-sh \"wallpaper --gui\""

# Hardware Media Keys
[[media_binds]]
key = "XF86AudioRaiseVolume"
action = "spawn-sh \"pamixer -i 5\""

[[media_binds]]
key = "XF86AudioLowerVolume"
action = "spawn-sh \"pamixer -d 5\""

[[media_binds]]
key = "XF86AudioMicMute"
action = "spawn-sh \"pamixer -i 5 --allow-boost\""

[[media_binds]]
key = "XF86AudioMute"
action = "spawn-sh \"pamixer -t\""

[[media_binds]]
key = "XF86MonBrightnessUp"
action = "spawn-sh \"brightnessctl s 5%+\""

[[media_binds]]
key = "XF86MonBrightnessDown"
action = "spawn-sh \"brightnessctl s 5%-\""

# Window Management Actions
[[window_binds]]
key = "Mod+Q"
repeat_false = true
action = "close-window"

[[window_binds]]
key = "Mod+O"
repeat_false = true
action = "toggle-overview"

[[window_binds]]
key = "Mod+V"
action = "toggle-window-floating"

[[window_binds]]
key = "Mod+Shift+V"
action = "switch-focus-between-floating-and-tiling"

[[window_binds]]
key = "Mod+W"
action = "toggle-column-tabbed-display"

[[window_binds]]
key = "Mod+F"
action = "fullscreen-window"

# Navigation Keys
[[nav_binds]]
key = "Mod+Left"
action = "focus-column-left"

[[nav_binds]]
key = "Mod+Down"
action = "focus-window-down"

[[nav_binds]]
key = "Mod+Up"
action = "focus-window-up"

[[nav_binds]]
key = "Mod+Right"
action = "focus-column-right"

[[nav_binds]]
key = "Mod+S"
action = "focus-column-right"

[[nav_binds]]
key = "Mod+L"
action = "focus-column-left"

[[nav_binds]]
key = "Mod+Home"
action = "focus-column-first"

[[nav_binds]]
key = "Mod+End"
action = "focus-column-last"

# Move Columns & Windows
[[move_binds]]
key = "Mod+Ctrl+Left"
action = "move-column-left"

[[move_binds]]
key = "Mod+Ctrl+Down"
action = "move-window-down"

[[move_binds]]
key = "Mod+Ctrl+Up"
action = "move-window-up"

[[move_binds]]
key = "Mod+Ctrl+Right"
action = "move-column-right"

# Workspace Bindings
[[workspace_binds]]
key = "Mod+1"
action = "focus-workspace 1"

[[workspace_binds]]
key = "Mod+Shift+1"
action = "move-column-to-workspace 1"

[[workspace_binds]]
