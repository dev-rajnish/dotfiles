# =============================================================================
#  Shell Environment Variables & Session Info (shell/env.toml)
# =============================================================================

username = "rsh"
editor = "nvim"
visual = "nvim"
terminal = "kitty"
browser = "google-chrome"
shoelace_dir = "~/shoelace"

[[env_vars]]
name = "EDITOR"
value = "nvim"

[[env_vars]]
name = "VISUAL"
value = "nvim"

[[env_vars]]
name = "TERMINAL"
value = "kitty"

[[env_vars]]
name = "BROWSER"
value = "google-chrome"

[[env_vars]]
name = "SHOELACE_DIR"
value = "~/shoelace"

[[env_vars]]
name = "sl-agy-alias"
value = "~/agy-conv/sl-agy"
