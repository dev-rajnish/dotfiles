# =============================================================================
#  Wallust Generated Yazi Flavor (flavor.toml)
#  Dynamic Tokyo Night inspired palette mapping
# =============================================================================

# -----------------------------------------------------------------------------
# 01. Manager & File List
# -----------------------------------------------------------------------------
[mgr]
cwd = { fg = "{{color6}}", italic = true }

# Hovered
hovered         = { bg = "{{color8}}", fg = "{{background}}", bold = true }
preview_hovered = { bg = "{{color8}}" }

# Find
find_keyword  = { fg = "{{background}}", bg = "{{color3}}", bold = true }
find_position = { fg = "{{color6}}", bg = "{{color8}}", bold = true }

# Marker
marker_copied   = { fg = "{{color2}}", bg = "{{color2}}" }
marker_cut      = { fg = "{{color1}}", bg = "{{color1}}" }
marker_marked   = { fg = "{{color5}}", bg = "{{color5}}" }
marker_selected = { fg = "{{color4}}", bg = "{{color4}}" }

# Count
count_copied   = { fg = "{{foreground}}", bg = "{{color2}}" }
count_cut      = { fg = "{{foreground}}", bg = "{{color1}}" }
count_selected = { fg = "{{foreground}}", bg = "{{color4}}" }

# Border
border_symbol = "│"
border_style  = { fg = "{{color6}}" }

# Tabs
[tabs]
active   = { fg = "{{background}}", bg = "{{color4}}", bold = true }
inactive = { fg = "{{background}}", bg = "{{color8}}" }

# -----------------------------------------------------------------------------
# 02. Operating Modes (Normal / Select / Unset)
# -----------------------------------------------------------------------------
[mode]
normal_main = { fg = "{{background}}", bg = "{{color4}}", bold = true }
normal_alt  = { fg = "{{background}}", bg = "{{color8}}", bold = true }

select_main = { fg = "{{background}}", bg = "{{color5}}", bold = true }
select_alt  = { fg = "{{background}}", bg = "{{color8}}", bold = true }

unset_main  = { fg = "{{background}}", bg = "{{color8}}", bold = true }
unset_alt   = { fg = "{{background}}", bg = "{{color0}}", bold = true }

# -----------------------------------------------------------------------------
# 03. Status Bar
# -----------------------------------------------------------------------------
[status]
overall         = { fg = "{{foreground}}", bg = "{{color0}}" }
separator_open  = ""
separator_close = ""

# Progress
progress_label  = { fg = "{{foreground}}", bold = true }
progress_normal = { fg = "{{background}}", bg = "{{color8}}", bold = true }
progress_error  = { fg = "{{background}}", bg = "{{color1}}", bold = true }

# Permissions
perm_type  = { fg = "{{color4}}" }
perm_read  = { fg = "{{color3}}" }
perm_write = { fg = "{{color1}}" }
perm_exec  = { fg = "{{color2}}" }
perm_sep   = { fg = "{{color8}}" }

# -----------------------------------------------------------------------------
# 04. Selection Pickers & Menus
# -----------------------------------------------------------------------------
[pick]
border   = { fg = "{{color6}}" }
active   = { fg = "{{foreground}}", bg = "{{color8}}" }
inactive = { fg = "{{foreground}}" }

# -----------------------------------------------------------------------------
# 05. Input Dialogs
# -----------------------------------------------------------------------------
[input]
border   = { fg = "{{color6}}" }
title    = { fg = "{{color6}}" }
value    = { fg = "{{color5}}" }
selected = { bg = "{{color8}}" }

# -----------------------------------------------------------------------------
# 06. Completions
# -----------------------------------------------------------------------------
[cmp]
border   = { fg = "{{color6}}" }
active   = { fg = "{{foreground}}", bg = "{{color8}}" }
inactive = { fg = "{{foreground}}" }

icon_file    = ""
icon_folder  = ""
icon_command = ""

# -----------------------------------------------------------------------------
# 07. Tasks Manager
# -----------------------------------------------------------------------------
[tasks]
border  = { fg = "{{color6}}" }
title   = { fg = "{{color6}}" }
hovered = { fg = "{{foreground}}", bg = "{{color8}}" }

# -----------------------------------------------------------------------------
# 08. Which Key Helper
# -----------------------------------------------------------------------------
[which]
cols            = 3
mask            = { bg = "{{color0}}" }
cand            = { fg = "{{color6}}" }
rest            = { fg = "{{color4}}" }
desc            = { fg = "{{color5}}" }
separator       = " ➜ "
separator_style = { fg = "{{color8}}" }

# -----------------------------------------------------------------------------
# 09. Confirmation Dialogs
# -----------------------------------------------------------------------------
[confirm]
border  = { fg = "{{color6}}" }
title   = { fg = "{{color6}}" }
content = {}
list    = {}
btn_yes = { bg = "{{color8}}" }
btn_no  = {}
btn_labels = [ "  [Y]es  ", "  (N)o  " ]

# -----------------------------------------------------------------------------
# 10. Spotting & Inspection
# -----------------------------------------------------------------------------
[spot]
border  = { fg = "{{color6}}" }
title   = { fg = "{{color6}}" }

# -----------------------------------------------------------------------------
# 11. System Notifications
# -----------------------------------------------------------------------------
[notify]
title_info  = { fg = "{{color6}}" }
title_warn  = { fg = "{{color3}}" }
title_error = { fg = "{{color1}}" }

icon_error = ""
icon_warn = ""
icon_info = ""

# -----------------------------------------------------------------------------
# 12. Help & Keybindings Overlay
# -----------------------------------------------------------------------------
[help]
on      = { fg = "{{color2}}" }
run     = { fg = "{{color5}}" }
desc    = { fg = "{{color6}}" }
hovered = { bg = "{{color8}}" }
footer  = { fg = "{{foreground}}", bg = "{{color0}}" }

# -----------------------------------------------------------------------------
# 13. File-specific & MIME Highlighting
# -----------------------------------------------------------------------------
[filetype]

rules = [
	# Images
	{ mime = "image/*", fg = "{{color3}}" },

	# Media (Audio & Video)
	{ mime = "{audio,video}/*", fg = "{{color5}}" },

	# Archives
	{ mime = "application/*zip", fg = "{{color1}}" },
	{ mime = "application/x-{tar,bzip*,7z-compressed,xz,rar}", fg = "{{color1}}" },

	# Documents
	{ mime = "application/{pdf,doc,rtf,vnd.*}", fg = "{{color6}}" },

	# Directories
	{ mime = "inode/directory", fg = "{{color4}}", bold = true },

	# Fallback
	{ mime = "*", fg = "{{foreground}}" }
]
