[Settings]
language = en
backend = swaybg
folder = ~/_ws/walls
monitors = All
wallpaper = ~/_ws/walls/street.png
show_path_in_tooltip = True
fill = fill
sort = daterev
color = #ffffff
subfolders = True
all_subfolders = True
show_hidden = False
show_gifs_only = False
zen_mode = False
post_command = cp -f "$wallpaper" ~/.config/background && pkill waypaper && theme-switcher
number_of_columns = 3
swww_transition_type = any
swww_transition_step = 63
swww_transition_angle = 0
swww_transition_duration = 2
swww_transition_fps = 60
mpvpaper_sound = False
mpvpaper_options = 
use_xdg_state = False
stylesheet = /home/rsh/.config/waypaper/style.css
keybindings = ~/.config/waypaper/keybindings.ini

