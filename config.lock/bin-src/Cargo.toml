[package]
name = "dot-tools"
version = "0.1.0"
edition = "2021"
authors = ["dev-rajnish <dev.rajnish@proton.me>"]
description = "High-performance styling populator, theme switcher, and power menu for Wayland desktop"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
colored = "3.1"
dirs = "6.0"
anyhow = "1.0"
rand = "0.10"

[[bin]]
name = "appearance-populator"
path = "src/bin/appearance_populator.rs"

[[bin]]
name = "theme-switcher"
path = "src/bin/theme_switcher.rs"

[[bin]]
name = "power-menu"
path = "src/bin/power_menu.rs"
