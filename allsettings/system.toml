# =============================================================================
#  System & Host Configuration (Single Source of Truth: tokens/system.toml)
# =============================================================================

# ⚙️ Host Platform, CPU & Garbage Collection
system = "x86_64-linux"
buildCores = 0          # 0 means uses all cores 
autoGcOlderThan = "33d"

# 👤 User & Host Identification
username = "rsh"
hostname = "nixos"
dotfilesDir = "shoelace"

# 💻 Hardware & Platform Profile
deviceType = "laptop"
gpuDriver = "amd"
enableEarlyKms = false


# 🌐 System Localization, Timezone & Keyboard
timeZone = "Asia/Kolkata"
defaultLocale = "en_US.UTF-8"
keyboardLayout = "us"
keyboardPath = ""

# 🐙 Git & GitHub Credentials
ghUsername = "dev-rajnish"
ghEmail = "dev.rajnish@proton.me"

# 🏷️ NixOS & Home Manager State Version
stateVersion = "26.05"
