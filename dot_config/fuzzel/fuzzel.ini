# =============================================================================
#  Fuzzel Application Launcher (Tokyo Night Sharp Aesthetic)
#  Location: ~/.config/fuzzel/fuzzel.ini
# =============================================================================

[main]
# Typography & Prompts
font=JetBrainsMono Nerd Font:size=13
dpi-aware=auto
prompt="❯ "
placeholder="Search apps, utilities, tools..."

# Window Dimensions & Layout
width=38
lines=10
horizontal-pad=20
vertical-pad=16
inner-pad=10
tabs=4

# Icons & Default Terminal
icons-enabled=yes
icon-theme=Tela-circle
terminal=kitty

# -----------------------------------------------------------------------------
# 📐 Sharp Edge Geometry (0 Corner Radius — Matches Niri Windows)
# -----------------------------------------------------------------------------
[border]
width=2
radius=0

# -----------------------------------------------------------------------------
# 🎨 Authentic Tokyo Night Color Palette (RGBA)
# -----------------------------------------------------------------------------
[colors]
background=1a1b26f2
text=c0caf5ff
prompt=7aa2f7ff
placeholder=565f89ff
input=c0caf5ff
match=bb9af7ff
selection=283457ff
selection-text=c0caf5ff
selection-match=7dcfffff
border=7aa2f7ff

[dmenu]
mode=text
exit-immediately-if-empty=no
