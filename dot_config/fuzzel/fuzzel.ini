# =============================================================================
#  Fuzzel Application Launcher (Tokyo Night Sharp Aesthetic)
#  Location: ~/.config/fuzzel/fuzzel.ini
# =============================================================================

[main]
# Include external modular colors
include=~/.config/fuzzel/colors.ini

# Typography & Prompts
font=JetBrainsMono Nerd Font:size=13
dpi-aware=auto
prompt="❯ "
placeholder="Search apps, utilities, tools..."

# Window Dimensions & Layout
width=38
lines=10
horizontal-pad=20
vertical-pad=16
inner-pad=10
tabs=4

# Icons & Default Terminal
icons-enabled=yes
icon-theme=Tela-circle
terminal=kitty

# -----------------------------------------------------------------------------
# 📐 Sharp Edge Geometry (0 Corner Radius — Matches Niri Windows)
# -----------------------------------------------------------------------------
[border]
width=2
radius=0

[dmenu]
mode=text
exit-immediately-if-empty=no
