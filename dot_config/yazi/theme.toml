# : Filetype & Icon Colors
[filetype]
rules = [
  # Directories
  { url = "*/", fg = "#e6e1cf" },

  # Executables & Scripts
  { url = "*", is = "exec", fg = "#aad94c" },
  { url = "*.sh", fg = "#aad94c" },
  { url = "*.bash", fg = "#aad94c" },
  { url = "*.fish", fg = "#aad94c" },

  # Configuration & Nix
  { url = "*.nix", fg = "#95e6cb" },
  { url = "*.kdl", fg = "#ffb454" },
  { url = "*.toml", fg = "#ffb454" },
  { url = "*.yaml", fg = "#ffb454" },
  { url = "*.yml", fg = "#ffb454" },
  { url = "*.json", fg = "#ffb454" },
  { url = "*.ini", fg = "#ffb454" },
  { url = "*.conf", fg = "#ffb454" },

  # Programming Languages
  { url = "*.rs", fg = "#ff8f40" },
  { url = "*.py", fg = "#ffb454" },
  { url = "*.js", fg = "#ffb454" },
  { url = "*.ts", fg = "#59c2ff" },
  { url = "*.tsx", fg = "#59c2ff" },
  { url = "*.jsx", fg = "#ffb454" },
  { url = "*.go", fg = "#95e6cb" },
  { url = "*.lua", fg = "#59c2ff" },
  { url = "*.c", fg = "#59c2ff" },
  { url = "*.cpp", fg = "#59c2ff" },
  { url = "*.h", fg = "#59c2ff" },
  { url = "*.hpp", fg = "#59c2ff" },

  # Web & Markup
  { url = "*.html", fg = "#ff8f40" },
  { url = "*.css", fg = "#59c2ff" },
  { url = "*.scss", fg = "#d2a6ff" },
  { url = "*.md", fg = "#e6e1cf" },
  { url = "*.org", fg = "#e6e1cf" },

  # Media
  { mime = "image/*", fg = "#ffb454" },
  { mime = "{audio,video}/*", fg = "#d2a6ff" },

  # Archives
  { mime = "application/*zip", fg = "#f07178" },
  { mime = "application/x-{tar,bzip*,7z-compressed,xz,rar,gzip}", fg = "#f07178" },

  # Documents
  { mime = "application/{pdf,doc,rtf,vnd.*}", fg = "#95e6cb" },

  # Special Files
  { url = "*", is = "orphan", fg = "#f07178" },
  { url = "*", is = "link", fg = "#95e6cb" },
  { url = "Dockerfile", fg = "#95e6cb" },
  { url = "justfile", fg = "#f07178" },
  { url = "Makefile", fg = "#f07178" },
  { url = "flake.lock", fg = "#3e4b59" },
]
