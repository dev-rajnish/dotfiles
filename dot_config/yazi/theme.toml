# Find
find_keyword = { fg = "#131721", bg = "#ffb454", bold = true }
find_position = { fg = "#ff8f40", bg = "#202229", bold = true }

# Marker
marker_copied = { fg = "#aad94c", bg = "#aad94c" }
marker_cut = { fg = "#f07178", bg = "#f07178" }
marker_marked = { fg = "#d2a6ff", bg = "#d2a6ff" }
marker_selected = { fg = "#ff8f40", bg = "#ff8f40" }

# Count
count_copied = { fg = "#131721", bg = "#aad94c" }
count_cut = { fg = "#131721", bg = "#f07178" }
count_selected = { fg = "#131721", bg = "#ff8f40" }

# Border
border_symbol = "│"
border_style = { fg = "#3e4b59" }

# Tabs
[tabs]
active = { fg = "#131721", bg = "#ff8f40", bold = true }
inactive = { fg = "#bfbdb6", bg = "#202229" }

# : Mode
[mode]
normal_main = { fg = "#131721", bg = "#ff8f40", bold = true }
normal_alt = { fg = "#ff8f40", bg = "#202229" }

select_main = { fg = "#131721", bg = "#d2a6ff", bold = true }
select_alt = { fg = "#d2a6ff", bg = "#202229" }

unset_main = { fg = "#131721", bg = "#ffb454", bold = true }
unset_alt = { fg = "#ffb454", bg = "#202229" }

# : Status bar
[status]
overall = { fg = "#e6e1cf", bg = "#131721" }
separator_open = ""
separator_close = ""

# Progress
progress_label = { fg = "#e6e1cf", bold = true }
progress_normal = { fg = "#131721", bg = "#202229" }
