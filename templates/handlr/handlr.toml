# =============================================================================
#  Handlr-regex Configuration (Auto-generated by sl-render from tokens)
#  Location: ~/.config/handlr/handlr.toml
# =============================================================================

enable_selector = true
selector = "fuzzel -d"

# Default terminal arguments
term_exec_args = "-e"

# ╭─────────────────────────────────────────────────────────╮
# │ Dynamic Application Handlers (tokens/apps.toml)         │
# ╰─────────────────────────────────────────────────────────╯

{% if browser is defined and browser %}
# Web Browsers & URL Schemes ({{ browser }})
[[handlers]]
exec = "{{ browser }} %u"
terminal = false
regexes = [
  '^(https?|ftp|about|chrome)://.*',
  '^mailto:.*',
]
{% endif %}

{% if editor is defined and editor %}
# Text, Code & Configuration Files ({{ editor }})
[[handlers]]
exec = "{{ editor }} %u"
terminal = false
regexes = [
  '.*\.(txt|md|markdown|json|toml|yaml|yml|xml|ini|conf|cfg|nix|py|rs|go|c|cpp|h|hpp|js|ts|jsx|tsx|sh|fish|zsh)$',
]
{% endif %}

{% if pdfViewer is defined and pdfViewer %}
# Documents & PDFs ({{ pdfViewer }})
[[handlers]]
exec = "{{ pdfViewer }} %u"
terminal = false
regexes = [
  '.*\.(pdf|epub|oxps|djvu|cbr|cbz)$',
]
{% endif %}

{% if imageViewer is defined and imageViewer %}
# Image Formats ({{ imageViewer }})
[[handlers]]
exec = "{{ imageViewer }} %u"
terminal = false
regexes = [
  '.*\.(png|jpg|jpeg|gif|webp|svg|bmp|avif|jxl|ico|tiff)$',
]
{% endif %}

{% if videoPlayer is defined and videoPlayer %}
# Video Files & Media Streams ({{ videoPlayer }})
[[handlers]]
exec = "{{ videoPlayer }} %u"
terminal = false
regexes = [
  '.*\.(mp4|mkv|webm|avi|mov|flv|wmv|ts)$',
  '^(https?://)?(www\.)?(youtube\.com|youtu\.be|twitch\.tv)/.*',
]
{% endif %}

{% if audioPlayer is defined and audioPlayer %}
# Audio Files ({{ audioPlayer }})
[[handlers]]
exec = "{{ audioPlayer }} %u"
terminal = false
regexes = [
  '.*\.(mp3|flac|wav|ogg|opus|m4a|aac|mid|midi)$',
]
{% endif %}

{% if fileManager is defined and fileManager %}
# Directories & Compressed Archives ({{ fileManager }})
[[handlers]]
exec = "{{ fileManager }} %u"
terminal = false
regexes = [
  '.*\.(zip|tar|tar\.gz|tgz|tar\.bz2|tbz2|tar\.xz|txz|7z|rar|iso)$',
]
{% endif %}
