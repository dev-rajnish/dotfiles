backend = none
folder = ~/_me/walls
monitors = All
wallpaper = ~/_me/walls/walls-catppuccin-mocha-masterk/car-wreck.png
show_path_in_tooltip = True
fill = stretch
sort = daterev
color = #ffffff
subfolders = True
all_subfolders = True
show_hidden = False
show_gifs_only = False
zen_mode = False
