# =============================================================================
#  Yazi File Manager Configuration
# =============================================================================

# 1. Manager Layout & Sorting
[mgr]
ratio = [2, 3, 5]
sort_by = "alphabetical"
sort_sensitive = false
sort_reverse = false
sort_dir_first = true
sort_translit = false
linemode = "none"
show_hidden = false
show_symlink = true
scrolloff = 5
mouse_events = ["click", "scroll"]
title_format = "Yazi: {cwd}"

# 2. Preview Window Configuration
[preview]
wrap = "yes"
tab_size = 2
max_width = 700
max_height = 900
cache_dir = ""
image_delay = 30
image_filter = "triangle"
image_quality = 75
sixel_fraction = 15
ueberzug_scale = 1
ueberzug_offset = [0, 0, 0, 0]

# 3. File Openers & Associations
[opener]
edit = [
  { run = 'nvim "$@"', desc = "Nvim", block = true, for = "unix" },
  { run = 'code %*', desc = "code", orphan = true, for = "windows" },
  { run = 'code -w %*', desc = "code (block)", block = true, for = "windows" },
]
open = [
  { run = 'xdg-open "$@"', desc = "Open", orphan = true, for = "linux" },
  { run = 'open "$@"', desc = "Open", orphan = true, for = "macos" },
  { run = 'start "" "%1"', desc = "Open", orphan = true, for = "windows" },
]
reveal = [
  { run = 'xdg-open "$(dirname "$1")"', desc = "Reveal", orphan = true, for = "linux" },
  { run = 'open -R "$1"', desc = "Reveal", orphan = true, for = "macos" },
  { run = 'explorer /select,"%1"', desc = "Reveal", orphan = true, for = "windows" },
  { run = '''exiftool "$1"; echo "Press enter to exit"; read _''', desc = "Show EXIF", block = true, for = "unix" },
]
extract = [
  { run = 'ya pub extract --list "$@"', desc = "Extract here", for = "unix" },
  { run = 'ya pub extract --list %*', desc = "Extract here", for = "windows" },
]
play = [
  { run = 'mpv --force-window "$@"', orphan = true, for = "unix" },
  { run = 'mpv --force-window %*', orphan = true, for = "windows" },
  { run = '''mediainfo "$1"; echo "Press enter to exit"; read _''', desc = "Show media info", block = true, for = "unix" },
]

[open]
rules = [
  # Folder
  { url = "*/", use = [
    "edit",
    "open",
    "reveal",
  ] },
  # Documents, PDF & E-Books (Must precede Archive rules so EPUB is not treated as generic zip)
  { mime = "application/{pdf,postscript,epub+zip,oxps,x-mobipocket-ebook,vnd.amazon.ebook,vnd.comicbook+zip,vnd.comicbook-rar,x-cbr,x-cbz,x-djvu}", use = [
    "open",
    "reveal",
  ] },
  { mime = "image/vnd.djvu", use = [
    "open",
    "reveal",
  ] },
  # Text & Code Files
  { mime = "text/*", use = [
    "edit",
    "reveal",
  ] },
  # Image Files
  { mime = "image/*", use = [
    "open",
    "reveal",
  ] },
  # Media Files (Audio & Video)
  { mime = "{audio,video}/*", use = [
    "play",
    "reveal",
  ] },
  # Archive Files
  { mime = "application/{zip,x-zip,x-zip-compressed,x-tar,x-gzip,gzip,x-bzip*,x-7z-compressed,x-xz,x-rar*,x-compressed-tar,zstd,x-zstd,x-cpio,x-iso9660-image,x-archive}", use = [
    "extract",
    "reveal",
  ] },
  # JSON, Scripts & Config Files
  { mime = "application/{json,x-ndjson,javascript,typescript,xml,yaml,toml,x-shellscript}", use = [
    "edit",
    "reveal",
  ] },
  # Empty files
  { mime = "inode/empty", use = [
    "edit",
    "reveal",
  ] },
  # Fallback to system default handlers via xdg-open "$@"
  { url = "*", use = [
    "open",
    "reveal",
  ] },
]

# 4. Input Dialog Geometry
[input]
cursor_blink = false

cd_title = "Change directory:"
cd_origin = "top-center"
cd_offset = [0, 2, 50, 3]

create_title = ["Create:", "Create (dir):"]
create_origin = "top-center"
create_offset = [0, 2, 50, 3]

rename_title = "Rename:"
rename_origin = "hovered"
rename_offset = [0, 1, 50, 3]

filter_title = "Filter:"
filter_origin = "top-center"
filter_offset = [0, 2, 50, 3]

find_title = ["Find next:", "Find previous:"]
find_origin = "top-center"
find_offset = [0, 2, 50, 3]

search_title = "Search via {n}:"
search_origin = "top-center"
search_offset = [0, 2, 50, 3]

shell_title = ["Shell:", "Shell (block):"]
shell_origin = "top-center"
shell_offset = [0, 2, 50, 3]

# 5. Action Confirmations
[confirm]
trash_title = "Trash {n} selected file{s}?"
trash_origin = "center"
trash_offset = [0, 0, 70, 20]

delete_title = "Permanently delete {n} selected file{s}?"
delete_origin = "center"
delete_offset = [0, 0, 70, 20]

overwrite_title = "Overwrite file?"
overwrite_content = "Will overwrite the following file:"
overwrite_origin = "center"
overwrite_offset = [0, 0, 50, 15]

quit_title = "Quit?"
quit_content = "The following task is still running, are you sure you want to quit?"
quit_origin = "center"
quit_offset = [0, 0, 50, 15]

# 6. Selection Pickers
[pick]
open_title = "Open with:"
open_origin = "hovered"
open_offset = [0, 1, 50, 7]

# 7. Keybind Helper Menu
[which]
sort_by = "none"
sort_sensitive = false
sort_reverse = false
sort_translit = false
