# =============================================================================
#  Desktop Appearance & Design Tokens
# =============================================================================

# 🔤 Typography & Font Sizing
# Make sure to install the appropriate pkgs from nixpkgs inside ../package.nix
[fonts.mono]
family = "JetBrainsMono Nerd Font"
italicFamily = "JetBrainsMono Nerd Font"
boldFamily = "auto"
boldItalicFamily = "auto"
features = ""

[fonts.italic]
family = "JetBrainsMono Nerd Font"
style = "Italic"

[fonts.sans]
family = "Inter"
style = "Regular"

[fonts.serif]
family = "Inter"
style = "Regular"

[fonts.emoji]
family = "Noto Color Emoji"

[fonts.sizes]
terminal = 16.0
bar = 12.0
launcher = 18.0
desktop = 12.0
powerMenu = 14.0
fastfetchLogo = 18.0

# 📐 Geometry, Radii, Gaps & Opacity
[appearance]
borderRadius = 0
borderWidth = 1
iconTheme = "Tela-circle-dark"

[appearance.gaps]
inner = 6
outer = 6
barGap = 2

[appearance.opacity]
terminal = 0.95
bar = 0.90
overlay = 0.88

# 🖱️ Cursor Theme & Size
# Make sure to install the appropriate pkgs from nixpkgs inside ../package.nix
[appearance.cursor]
name = "Bibata-Modern-Ice"
size = 32
