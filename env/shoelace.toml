# =============================================================================
#  Shoelace System & Renderer Configuration (env/shoelace.toml)
#  Single Source of Truth for Template Mappings & Token Source Directories
# =============================================================================

[paths]
templates_dir = "env/templates"
config_dir = "config"
themes_dir = "env/themes"
tokens_dirs = [
  "env/tokens",
  "env/settings",
  "env/token.db",
  "env/token.kv",
  "env/token",
  "env/data",
  "env",
]

# =============================================================================
#  Application Template Mappings ([[appname]] -> tmpl, dest)
# =============================================================================

[[niri]]
tmpl = "appearance.kdl"
dest = "sl_appearance.kdl"

[[niri]]
tmpl = "colors.kdl"
dest = "sl_colors.kdl"

[[niri]]
tmpl = "keybinds.kdl"
dest = "sl_keybinds.kdl"

[[kitty]]
tmpl = "appearance.conf"
dest = "sl_appearance.conf"

[[kitty]]
tmpl = "colors.conf"
dest = "sl_colors.conf"

[[fuzzel]]
tmpl = "appearance.ini"
dest = "sl_appearance.ini"

[[fuzzel]]
tmpl = "colors.ini"
dest = "sl_colors.ini"

[[wayle]]
tmpl = "appearance.toml"
dest = "sl_appearance.toml"

[[wayle]]
tmpl = "colors.toml"
dest = "sl_colors.toml"

[[swaylock]]
tmpl = "config"
dest = "sl_config"

[[fish]]
tmpl = "aliases.fish"
dest = "conf.d/sl_aliases.fish"

[[fish]]
tmpl = "paths.fish"
dest = "conf.d/sl_paths.fish"

[[fish]]
tmpl = "env.fish"
dest = "conf.d/sl_env.fish"
