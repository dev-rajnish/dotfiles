[package]
name = "sys-tools"
version = "0.1.0"
edition = "2021"
authors = ["dev-rajnish <dev.rajnish@proton.me>"]
description = "High-performance NixOS & Dotfiles Management CLI Tools in Rust"

[dependencies]
anyhow = "1.0"
nix = { version = "0.29", features = [
  "process",
  "signal",
  "user",
  "fs",
  "hostname",
] }
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
ureq = "2.10"
regex = "1.11"
rand = "0.8"
which = "7.0"
walkdir = "2.5"

[[bin]]
name = "loader"
path = "src/bin/loader.rs"

[[bin]]
name = "wallpaper"
path = "src/bin/wallpaper.rs"

[[bin]]
name = "power-menu"
path = "src/bin/power_menu.rs"

[[bin]]
name = "update-agy"
path = "src/bin/update_agy.rs"

[[bin]]
name = "dot"
path = "src/bin/dot.rs"

[[bin]]
name = "installer"
path = "src/bin/installer.rs"

[[bin]]
name = "y"
path = "src/bin/y.rs"
