# =============================================================================
#  Fonts, Cursor & Icon Tokens (tokens/ui.toml)
# =============================================================================

# 🔤 Typography
[fonts]
mono = "JetBrainsMono Nerd Font"
sans = "Inter"
serif = "Inter"
emoji = "Noto Color Emoji"

# 📏 Component Sizing
[sizes]
terminal = 14.0
bar = 11.0
launcher = 18.0
desktop = 14.0
power_menu = 14.0
fastfetch_logo = 18.0

# 🖱️ System & Application Cursor
[cursor]
name = "Bibata-Modern-Classic"
size = 38

# 🖼️ Desktop Icon Theme
[icons]
theme = "Tela-circle-dark"
dark = "Tela-circle-dark"
light = "Tela-circle-light"
