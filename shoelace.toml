# =============================================================================
#  Shoelace System & Renderer Configuration (shoelace.toml)
#  Single Source of Truth for Template Mappings & Token Source Directories
# =============================================================================

[paths]
templates_dir = "templates"
config_dir = "config"
themes_dir = "themes"
tokens_dirs = ["tokens"]

# =============================================================================
#  Application Template Mappings ([[appname]] -> tmpl, dest)
# =============================================================================

[[niri]]
tmpl = "appearance.kdl"
dest = "sl_appearance.kdl"

[[niri]]
tmpl = "colors.kdl"
dest = "sl_colors.kdl"

[[niri]]
tmpl = "keybinds.kdl"
dest = "sl_keybinds.kdl"

[[kitty]]
tmpl = "appearance.conf"
dest = "sl_appearance.conf"

[[kitty]]
tmpl = "colors.conf"
dest = "sl_colors.conf"

[[fuzzel]]
tmpl = "appearance.ini"
dest = "sl_appearance.ini"

[[fuzzel]]
tmpl = "colors.ini"
dest = "sl_colors.ini"

[[handlr]]
tmpl = "handlr.toml"
dest = "handlr.toml"

[[mappings]]
app = ""
tmpl = "mimeapps.list"
dest = "mimeapps.list"

[[wayle]]
tmpl = "appearance.toml"
dest = "sl_appearance.toml"

[[wayle]]
tmpl = "colors.toml"
dest = "sl_colors.toml"

[[swaylock]]
tmpl = "config"
dest = "sl_config"

[[fish]]
tmpl = "aliases.fish"
dest = "conf.d/sl_aliases.fish"

[[fish]]
tmpl = "paths.fish"
dest = "conf.d/sl_paths.fish"

[[fish]]
tmpl = "env.fish"
dest = "conf.d/sl_env.fish"

# =============================================================================
#  Nix Package Module Mappings
# =============================================================================

[[pkgs]]
tmpl = "pkgs/system.nix.j2"
dest = "modules/pkgs/system.nix"

[[pkgs]]
tmpl = "pkgs/font.nix.j2"
dest = "modules/pkgs/font.nix"

[[pkgs]]
tmpl = "pkgs/nix-ld.nix.j2"
dest = "modules/pkgs/nix-ld.nix"

[[pkgs]]
tmpl = "pkgs/fhs.nix.j2"
dest = "modules/pkgs/fhs.nix"

[[pkgs]]
tmpl = "pkgs/home-manager.nix.j2"
dest = "modules/pkgs/home-manager.nix"

